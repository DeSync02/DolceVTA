<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolce Vita Community Portal – Prototype</title>
<meta name="description" content="Interactive UI/UX prototype of the Dolce Vita Community Portal (VitaTech, SADL05C Phase 4).">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#161B26}
a{color:#93C5FD}a:hover{color:#BFDBFE}
button{font-family:inherit}
button:not(:disabled){cursor:pointer}
button:not(:disabled):hover{filter:brightness(1.1)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8B93A3}
select option{color:#111827;background:#FFFFFF}
@keyframes dvspin{to{transform:rotate(360deg)}}
</style>

</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #161B26; color: #F3F4F6; font-family: 'Poppins', system-ui, sans-serif; font-size: 15px; line-height: 1.55">

<!-- PROTOTYPE CONTROL BAR (not part of the design) -->
<sc-if value="{{showBar}}" hint-placeholder-val="{{ true }}">
<div style="background: #05070B; border-bottom: 1px solid #2A3142; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: #C9CED8">
<span style="font-weight: 700; color: #F5B800; letter-spacing: 0.04em">PROTOTYPE</span>
<span style="padding: 2px 10px; border-radius: 999px; background: #1F2937; color: #F3F4F6; font-weight: 600">{{meta.id}} · {{meta.name}}</span>
<span style="display: flex; align-items: center; gap: 6px">
<label for="jump" style="color: #C9CED8">Jump to</label>
<select id="jump" value="{{screen}}" onChange="{{jump}}" style="min-height: 32px; border-radius: 6px; background: #111827; color: #F3F4F6; border: 1px solid #4B5563; font-family: inherit; font-size: 13px; padding: 0 6px">
<optgroup label="Public">
<option value="landing">SCR-01 Landing Page</option>
<option value="about">SCR-02 About Us</option>
<option value="community">SCR-03 Community Page</option>
<option value="register">SCR-04 Resident Registration</option>
<option value="login">SCR-05 Login Page</option>
<option value="forgot">SCR-06 Forgot Password</option>
<option value="status">SCR-09 Registration Status</option>
</optgroup>
<optgroup label="Resident">
<option value="rhome">SCR-07 Resident Landing Page</option>
<option value="ann">SCR-08 View Announcements</option>
<option value="complain">SCR-10 Post Complaint</option>
<option value="mycomp">SCR-11 My Complaints Submitted</option>
<option value="dues">SCR-12 View Dues</option>
<option value="pay">SCR-13 Online Payment (QR Ph)</option>
<option value="receipt">SCR-14 Digital Receipt</option>
<option value="profile">SCR-15 Profile Details</option>
</optgroup>
<optgroup label="Administrator">
<option value="ahome">SCR-16 Admin Dashboard</option>
<option value="ares">SCR-17 Manage Resident Accounts</option>
<option value="averify">SCR-18 Verification Review (OCR)</option>
<option value="aann">SCR-19 Post Announcements</option>
<option value="acomp">SCR-20 Manage Complaints</option>
<option value="adues">SCR-21 Manage Dues</option>
</optgroup>
<optgroup label="System">
<option value="denied">SCR-22 Access Restricted</option>
</optgroup>
</select>
</span>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span>View as</span>
<button type="button" onClick="{{asVisitor}}" style="min-height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #4B5563; background: #111827; color: #F3F4F6; font-size: 13px">Visitor</button>
<button type="button" onClick="{{asResident}}" style="min-height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #4B5563; background: #111827; color: #F3F4F6; font-size: 13px">Resident</button>
<button type="button" onClick="{{asAdmin}}" style="min-height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #4B5563; background: #111827; color: #F3F4F6; font-size: 13px">Admin</button>
<button type="button" onClick="{{resetAll}}" style="min-height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #4B5563; background: transparent; color: #C9CED8; font-size: 13px">Reset sample data</button>
</span>
</div>
</sc-if>

<!-- GLOBAL HEADER -->
<sc-if value="{{showNav}}" hint-placeholder-val="{{ true }}">
<header style="background: #FFFFFF; color: #1F2937; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; border-bottom: 1px solid #E5E7EB">
<button type="button" onClick="{{goHome}}" aria-label="Dolce Vita Community Portal, go to home" style="display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 6px 0; min-height: 44px">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34"><rect x="0" y="0" width="34" height="34" rx="6" fill="#2B5FC4"></rect><path d="M4 27 L13 13 L19 21 L23 16 L30 27 Z" fill="#FFFFFF"></path><circle cx="25" cy="9" r="3" fill="#F5B800"></circle></svg>
<span style="font-size: 18px; font-weight: 700; color: #2B5FC4">Dolce Vita <span style="color: #7A5A00">Community Portal</span></span>
</button>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.go}}" aria-current="{{n.cur}}" style="min-height: 44px; padding: 0 12px; background: none; border: none; border-bottom: 3px solid {{n.line}}; color: {{n.fg}}; font-size: 14px; font-weight: 500">{{n.label}}</button>
</sc-for>
<sc-if value="{{isGuest}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{goLogin}}" style="min-height: 44px; padding: 0 12px; background: none; border: none; border-bottom: 3px solid {{loginLine}}; color: #1F2937; font-size: 14px; font-weight: 500">Log in</button>
<button type="button" onClick="{{goRegister}}" style="min-height: 40px; padding: 0 16px; margin-left: 4px; background: #F5B800; color: #1A1A1A; border: none; border-radius: 8px; font-size: 14px; font-weight: 600">Register</button>
</sc-if>
<sc-if value="{{isAuth}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 8px; margin-left: 8px; padding-left: 12px; border-left: 1px solid #E5E7EB">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #2B5FC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{userInitials}}</span>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 13px; font-weight: 600; color: #1F2937">{{userName}}</span><span style="font-size: 12px; color: #4B5563">{{roleLabel}}</span></span>
<button type="button" onClick="{{askLogout}}" style="min-height: 40px; padding: 0 14px; margin-left: 4px; background: #FFFFFF; color: #1F2937; border: 1px solid #9CA3AF; border-radius: 8px; font-size: 14px; font-weight: 500">Log out</button>
</span>
</sc-if>
</nav>
</header>
</sc-if>

<!-- ============ PUBLIC LAYOUT ============ -->

<!-- SCR-01 LANDING -->
<sc-if value="{{s.landing}}" hint-placeholder-val="{{ true }}">
<main>
<section style="background: #0E131D; padding: 96px 24px 88px; text-align: center; border-bottom: 1px solid #252C3B">
<p style="margin: 0 0 8px; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #F5B800; font-weight: 600">Villaggio de Xavier Dolce Vita · Biñan City, Laguna</p>
<h1 style="margin: 0; font-size: 48px; line-height: 1.15; font-weight: 700">Welcome to<br><span style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 52px">Dolce Vita Community!</span></h1>
<p style="max-width: 620px; margin: 20px auto 32px; font-size: 17px; color: #D1D5DB">One place for village announcements, concerns, and monthly dues — so residents no longer have to follow updates across group chats.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center">
<button type="button" onClick="{{goRegister}}" style="min-height: 48px; padding: 0 24px; background: #F5B800; color: #1A1A1A; border: none; border-radius: 8px; font-size: 16px; font-weight: 600">Register as a resident</button>
<button type="button" onClick="{{goLogin}}" style="min-height: 48px; padding: 0 24px; background: transparent; color: #F3F4F6; border: 1px solid #9CA3AF; border-radius: 8px; font-size: 16px; font-weight: 500">Log in</button>
</div>
</section>
<section aria-labelledby="feat-h" style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 24px">
<h2 id="feat-h" style="margin: 0 0 24px; font-size: 24px">What residents can do in the portal</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 20px"><h3 style="margin: 0 0 6px; font-size: 17px; color: #F5B800">Announcements</h3><p style="margin: 0; color: #C9CED8; font-size: 14px">Read official notices from the association in one feed.</p></div>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 20px"><h3 style="margin: 0 0 6px; font-size: 17px; color: #F5B800">Complaints</h3><p style="margin: 0; color: #C9CED8; font-size: 14px">File a concern and follow its status until it's resolved.</p></div>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 20px"><h3 style="margin: 0 0 6px; font-size: 17px; color: #F5B800">Dues and QR Ph payments</h3><p style="margin: 0; color: #C9CED8; font-size: 14px">See your ₱840 monthly dues, pay online, and keep digital receipts.</p></div>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 20px"><h3 style="margin: 0 0 6px; font-size: 17px; color: #F5B800">Verified residents only</h3><p style="margin: 0; color: #C9CED8; font-size: 14px">Proof of residency is checked before an account is activated.</p></div>
</div>
</section>
<section aria-labelledby="how-h" style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px">
<h2 id="how-h" style="margin: 0 0 24px; font-size: 24px">How registration works</h2>
<ol style="list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<li style="display: flex; gap: 14px"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #F5B800; color: #1A1A1A; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span><span><strong>Register and upload proof</strong><br><span style="color: #C9CED8; font-size: 14px">Fill in your details and upload a barangay certificate or other proof of residency.</span></span></li>
<li style="display: flex; gap: 14px"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #F5B800; color: #1A1A1A; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span><span><strong>Document check and admin review</strong><br><span style="color: #C9CED8; font-size: 14px">The portal reads your document (OCR) and an administrator makes the final decision.</span></span></li>
<li style="display: flex; gap: 14px"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #F5B800; color: #1A1A1A; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span><span><strong>Log in</strong><br><span style="color: #C9CED8; font-size: 14px">You'll get an email once approved, then you can log in to the resident portal.</span></span></li>
</ol>
</section>
<footer style="border-top: 1px solid #252C3B; padding: 20px 24px; text-align: center; font-size: 13px; color: #B8BFCC">Villaggio de Xavier Dolce Vita Village · Barangay Zapote, Biñan City, Laguna · Developed by VitaTech</footer>
</main>
</sc-if>

<!-- SCR-02 ABOUT -->
<sc-if value="{{s.about}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-wrap: wrap; gap: 24px">
<section aria-labelledby="about-h" style="flex: 1 1 340px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 28px">
<h1 id="about-h" style="margin: 0 0 12px; font-size: 28px; color: #F5B800">About us</h1>
<p style="margin: 0 0 12px; color: #D1D5DB">The <strong>Dolce Vita Community Portal</strong> brings residents of Villaggio de Xavier Dolce Vita Village together in one organized, easy-to-use space. It replaces scattered group-chat updates and paper records with a single portal for announcements, concerns, dues and payment records.</p>
<p style="margin: 0 0 20px; color: #D1D5DB">The portal was built by VitaTech as a semester project for SADL05C – System Analysis and Design at Lyceum of the Philippines University.</p>
<button type="button" onClick="{{goCommunity}}" style="min-height: 44px; padding: 0 20px; background: #F5B800; color: #1A1A1A; border: none; border-radius: 8px; font-weight: 600">Visit the Community page</button>
</section>
<section aria-labelledby="team-h" style="flex: 2 1 520px">
<h2 id="team-h" style="margin: 0 0 16px; font-size: 22px; color: #F5B800">Meet our team</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px">
<sc-for list="{{team}}" as="m" hint-placeholder-count="5">
<li style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 18px 14px; text-align: center">
<div role="img" aria-label="Photo placeholder for team member" style="width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 50%; border: 3px solid #F5B800; background: #2A3142; display: flex; align-items: center; justify-content: center; color: #B8BFCC; font-size: 12px">Photo</div>
<p style="margin: 0; font-weight: 600; font-size: 14px">[Member name]</p>
<p style="margin: 4px 0 0; font-size: 13px; color: #C9CED8">{{m.role}}</p>
</li>
</sc-for>
</ul>
</section>
</main>
</sc-if>

<!-- SCR-03 COMMUNITY -->
<sc-if value="{{s.community}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-labelledby="comm-h" style="flex: 1 1 340px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 28px">
<h1 id="comm-h" style="margin: 0 0 16px; font-size: 28px; color: #F5B800">Our community</h1>
<dl style="margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px">
<div><dt style="font-size: 13px; color: #B8BFCC">Location</dt><dd style="margin: 0">Villaggio de Xavier Dolce Vita, Barangay Zapote, Biñan City, Laguna</dd></div>
<div><dt style="font-size: 13px; color: #B8BFCC">Monthly association dues</dt><dd style="margin: 0">₱840.00, due on the last day of each month</dd></div>
<div><dt style="font-size: 13px; color: #B8BFCC">Ways to pay</dt><dd style="margin: 0">Online through QR Ph in the portal, or onsite at the association office</dd></div>
<div><dt style="font-size: 13px; color: #B8BFCC">Association office hours</dt><dd style="margin: 0">[Office hours]</dd></div>
<div><dt style="font-size: 13px; color: #B8BFCC">Contact</dt><dd style="margin: 0">[Association contact number / email]</dd></div>
</dl>
</section>
<section aria-labelledby="fb-h" style="flex: 1 1 420px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 28px">
<h2 id="fb-h" style="margin: 0 0 4px; font-size: 22px">Share your feedback</h2>
<p style="margin: 0 0 20px; color: #C9CED8; font-size: 14px">Tell us how we can improve the portal or the village. <span aria-hidden="true" style="color: #FCD34D">*</span> Required</p>
<form onSubmit="{{submitFeedback}}" novalidate="true" style="display: flex; flex-direction: column; gap: 16px">
<div>
<label for="fb_name" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Name (optional)</label>
<input id="fb_name" type="text" autocomplete="name" value="{{f.fb_name}}" onChange="{{on.fb_name}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; border: 1px solid #6B7280">
</div>
<div>
<label for="fb_type" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Feedback about</label>
<select id="fb_type" value="{{f.fb_type}}" onChange="{{on.fb_type}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; border: 1px solid #6B7280">
<option value="The portal">The portal</option>
<option value="The village">The village</option>
<option value="Association services">Association services</option>
</select>
</div>
<div>
<label for="fb_msg" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Message <span aria-hidden="true" style="color: #FCD34D">*</span></label>
<textarea id="fb_msg" rows="4" value="{{f.fb_msg}}" onChange="{{on.fb_msg}}" aria-invalid="{{inv.fb_msg}}" aria-required="true" aria-describedby="fb_msg-help" style="width: 100%; box-sizing: border-box; min-height: 110px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; resize: vertical; border: 1px solid {{bc.fb_msg}}"></textarea>
<p id="fb_msg-help" style="margin: 6px 0 0; font-size: 13px; color: #B8BFCC">10–500 characters.</p>
<sc-if value="{{err.fb_msg}}" hint-placeholder-val="{{ false }}"><p style="display: flex; gap: 6px; align-items: flex-start; color: #FCA5A5; font-size: 13px; margin: 6px 0 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>{{err.fb_msg}}</p></sc-if>
</div>
<div style="display: flex; justify-content: flex-end"><button type="submit" style="min-height: 44px; padding: 0 22px; background: #F5B800; color: #1A1A1A; border: none; border-radius: 8px; font-weight: 600">Send feedback</button></div>
</form>
</section>
</main>
</sc-if>

<!-- SCR-04 REGISTRATION -->
<sc-if value="{{s.register}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 820px; margin: 0 auto; padding: 40px 24px 64px">
<h1 style="margin: 0 0 4px; font-size: 28px">Resident registration</h1>
<p style="margin: 0 0 20px; color: #C9CED8">Create your account and upload proof that you live in Dolce Vita. An administrator reviews every application. <span aria-hidden="true" style="color: #FCD34D">*</span> Required field</p>
<section aria-labelledby="pn-h" style="background: #1B2333; border: 1px solid #3B4A66; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px">
<h2 id="pn-h" style="margin: 0 0 6px; font-size: 16px; color: #BFDBFE">Privacy notice</h2>
<p style="margin: 0; font-size: 14px; color: #D1D5DB">We collect your name, birthdate, contact details, address and proof-of-residency document only to verify residency and manage your account, dues and concerns. Your document is visible only to you and authorized administrators. [Insert the association's approved privacy notice and data-handling policy.]</p>
</section>
<sc-if value="{{regSummary}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; gap: 10px; background: #3B0A0A; border: 1px solid #EF4444; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; color: #FECACA"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span><strong>{{regSummary}}</strong> Fix the highlighted fields, then submit again.</span></div>
</sc-if>
<form onSubmit="{{submitRegister}}" novalidate="true" style="display: flex; flex-direction: column; gap: 20px">
<fieldset style="margin: 0; border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 20px; background: rgba(255,255,255,0.04)">
<legend style="padding: 0 8px; font-weight: 600; color: #F5B800">Personal information</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div>
<label for="reg_first" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">First name <span aria-hidden="true" style="color: #FCD34D">*</span></label>
<input id="reg_first" type="text" autocomplete="given-name" value="{{f.reg_first}}" onChange="{{on.reg_first}}" aria-invalid="{{inv.reg_first}}" aria-required="true" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; border: 1px solid {{bc.reg_first}}">
<sc-if value="{{err.reg_first}}" hint-placeholder-val="{{ false }}"><p style="display: flex; gap: 6px; align-items: flex-start; color: #FCA5A5; font-size: 13px; margin: 6px 0 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>{{err.reg_first}}</p></sc-if>
</div>
<div>
<label for="reg_middle" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Middle name (optional)</label>

<button type="button" onClick="{{goADues}}" style="text-align: left; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-top: 4px solid #F87171; border-radius: 14px; padding: 16px; color: #F3F4F6"><span style="display: block; font-size: 13px; color: #B8BFCC">Unpaid · {{curMonthLabel}}</span><span style="display: block; font-size: 28px; font-weight: 700">{{curUnpaid}}</span><span style="display: block; font-size: 13px; color: #93C5FD; text-decoration: underline">Go to dues</span></button>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-top: 4px solid #4ADE80; border-radius: 14px; padding: 16px"><span style="display: block; font-size: 13px; color: #B8BFCC">Collected · {{curMonthLabel}}</span><span style="display: block; font-size: 28px; font-weight: 700">{{curCollected}}</span><span style="display: block; font-size: 13px; color: #C9CED8">{{curPaid}} of {{curTotal}} residents paid</span></div>
</div>
</sc-if>

<!-- SCR-17 MANAGE RESIDENT ACCOUNTS -->
<sc-if value="{{s.ares}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px">
<div><h1 style="margin: 0; font-size: 28px; color: #F5B800">Residents approval</h1><p style="margin: 2px 0 0; color: #C9CED8; font-size: 14px">Review registrations and verify proof of residency.</p></div>
<div style="width: 300px; max-width: 100%">
<label for="search_res" style="display: block; font-size: 13px; color: #C9CED8; margin-bottom: 4px">Search name, email or block</label>
<input id="search_res" type="search" value="{{f.search_res}}" onChange="{{on.search_res}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; border: 1px solid #6B7280">
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px">
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-top: 4px solid #60A5FA; border-radius: 14px; padding: 14px"><p style="margin: 0; font-size: 13px; color: #B8BFCC">Total registrations</p><p style="margin: 0; font-size: 24px; font-weight: 700">{{resStats.total}}</p></div>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-top: 4px solid #FCD34D; border-radius: 14px; padding: 14px"><p style="margin: 0; font-size: 13px; color: #B8BFCC">Pending</p><p style="margin: 0; font-size: 24px; font-weight: 700">{{resStats.pending}}</p></div>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-top: 4px solid #4ADE80; border-radius: 14px; padding: 14px"><p style="margin: 0; font-size: 13px; color: #B8BFCC">Approved</p><p style="margin: 0; font-size: 24px; font-weight: 700">{{resStats.approved}}</p></div>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-top: 4px solid #F87171; border-radius: 14px; padding: 14px"><p style="margin: 0; font-size: 13px; color: #B8BFCC">Rejected</p><p style="margin: 0; font-size: 24px; font-weight: 700">{{resStats.rejected}}</p></div>
</div>
<div role="group" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px">
<sc-for list="{{resTabs}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.sel}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 500">{{t.label}} ({{t.count}})</button>
</sc-for>
</div>
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; overflow-x: auto">
<div role="table" aria-label="Resident registrations" style="min-width: 1000px">
<div role="row" style="display: grid; grid-template-columns: 36px minmax(0, 1.6fr) minmax(0, 1.8fr) 110px 130px 110px 120px 230px; gap: 12px; padding: 12px 16px; background: rgba(255,255,255,0.06); font-size: 13px; font-weight: 600; color: #D1D5DB">
<span role="columnheader">#</span><span role="columnheader">Resident</span><span role="columnheader">Email</span><span role="columnheader">Block &amp; lot</span><span role="columnheader">Contact</span><span role="columnheader">OCR match</span><span role="columnheader">Status</span><span role="columnheader">Actions</span>
</div>
<sc-for list="{{resRows}}" as="r" hint-placeholder-count="5">
<div role="row" style="display: grid; grid-template-columns: 36px minmax(0, 1.6fr) minmax(0, 1.8fr) 110px 130px 110px 120px 230px; gap: 12px; padding: 12px 16px; align-items: center; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.1)">
<span role="cell" style="color: #B8BFCC">{{r.n}}</span>
<span role="cell" style="display: flex; align-items: center; gap: 8px; min-width: 0"><span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: #374151; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{r.initials}}</span><span style="min-width: 0"><span style="display: block; font-weight: 600">{{r.name}}</span><span style="display: block; font-size: 12px; color: #B8BFCC">Applied {{r.submittedText}}</span></span></span>
<span role="cell" style="color: #D1D5DB; overflow-wrap: anywhere">{{r.email}}</span>
<span role="cell" style="color: #D1D5DB">{{r.blockLot}}</span>
<span role="cell" style="color: #D1D5DB">{{r.phone}}</span>
<span role="cell" style="color: {{r.confFg}}; font-weight: 600">{{r.confText}}</span>
<span role="cell"><span style="display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: {{r.b.bg}}; color: {{r.b.fg}}">{{r.b.text}}</span></span>
<span role="cell" style="display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" onClick="{{r.review}}" aria-label="{{r.reviewAria}}" style="min-height: 36px; padding: 0 10px; background: transparent; color: #F3F4F6; border: 1px solid #9CA3AF; border-radius: 8px; font-size: 13px">{{r.reviewLabel}}</button>
<sc-if value="{{r.isPending}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{r.approve}}" aria-label="{{r.approveAria}}" style="min-height: 36px; padding: 0 10px; background: #15803D; color: #FFFFFF; border: none; border-radius: 8px; font-size: 13px; font-weight: 600">Approve</button>
<button type="button" onClick="{{r.reject}}" aria-label="{{r.rejectAria}}" style="min-height: 36px; padding: 0 10px; background: #B91C1C; color: #FFFFFF; border: none; border-radius: 8px; font-size: 13px; font-weight: 600">Reject</button>
</sc-if>
</span>
</div>
</sc-for>
<sc-if value="{{resEmpty}}" hint-placeholder-val="{{ false }}"><div style="padding: 32px 16px; text-align: center; color: #C9CED8; border-top: 1px solid rgba(255,255,255,0.1)">No residents match your search or filter. <button type="button" onClick="{{clearResFilters}}" style="background: none; border: none; color: #93C5FD; text-decoration: underline; font-size: 14px; min-height: 36px">Clear filters</button></div></sc-if>
</div>
</div>
<p style="margin: 10px 0 0; font-size: 13px; color: #B8BFCC">Showing {{resRowsCount}} of {{resStats.total}} registrations</p>
</sc-if>

<!-- SCR-18 VERIFICATION REVIEW -->
<sc-if value="{{s.averify}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px">
<div><h1 style="margin: 0; font-size: 28px; color: #F5B800">Verification review</h1><p style="margin: 2px 0 0; color: #C9CED8; font-size: 14px">{{v.name}} · Applied {{v.submitted}}</p></div>
<span style="display: inline-flex; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{v.b.bg}}; color: {{v.b.fg}}">{{v.b.text}}</span>
</div>
<div role="note" style="background: #1B2333; border: 1px solid #3B4A66; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; color: #DBEAFE">ⓘ OCR results help you compare details faster. They never approve an account automatically — the decision is yours.</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section aria-labelledby="vd-h" style="flex: 1 1 300px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 18px">
<h2 id="vd-h" style="margin: 0 0 12px; font-size: 16px">Uploaded document</h2>
<div role="img" aria-label="{{v.docAria}}" style="background: #FFFFFF; border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 8px; height: 280px; box-sizing: border-box; filter: {{v.docBlur}}">
<div style="height: 12px; background: #CBD5E1; border-radius: 2px; width: 60%; align-self: center"></div><div style="height: 8px; background: #E2E8F0; border-radius: 2px; width: 40%; align-self: center"></div><div style="height: 14px; background: #94A3B8; border-radius: 2px; width: 70%; align-self: center; margin-top: 12px"></div><div style="height: 7px; background: #E2E8F0; border-radius: 2px; margin-top: 14px"></div><div style="height: 7px; background: #E2E8F0; border-radius: 2px"></div><div style="height: 7px; background: #E2E8F0; border-radius: 2px; width: 85%"></div><div style="height: 7px; background: #E2E8F0; border-radius: 2px"></div><div style="height: 7px; background: #E2E8F0; border-radius: 2px; width: 60%"></div><div style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid #CBD5E1; margin-top: auto; align-self: flex-end"></div>
</div>
<p style="margin: 10px 0 0; font-size: 13px; color: #C9CED8">{{v.doc}} · {{v.fileName}}</p>
</section>
<section aria-labelledby="vo-h" style="flex: 2 1 420px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 18px">
<h2 id="vo-h" style="margin: 0 0 12px; font-size: 16px">OCR comparison</h2>
<sc-if value="{{v.ocrOk}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 16px">
<p style="margin: 0; font-size: 36px; font-weight: 700">{{v.confText}}</p>
<div style="flex: 1 1 200px">
<p style="margin: 0 0 6px; font-size: 14px"><strong style="color: {{v.confFg}}">{{v.confLevel}}</strong> confidence that the document matches the registration</p>
<div role="progressbar" aria-label="OCR confidence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{v.conf}}" style="height: 10px; border-radius: 999px; background: #374151; overflow: hidden"><div style="height: 100%; width: {{v.confWidth}}; background: {{v.confFg}}"></div></div>
</div>
</div>
<div role="table" aria-label="Registration versus extracted details" style="font-size: 14px">
<div role="row" style="display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr) 110px; gap: 10px; padding: 8px 0; font-size: 13px; font-weight: 600; color: #D1D5DB; border-bottom: 1px solid rgba(255,255,255,0.14)"><span role="columnheader">Field</span><span role="columnheader">Registration</span><span role="columnheader">Extracted by OCR</span><span role="columnheader">Result</span></div>
<sc-for list="{{vRows}}" as="x" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr) 110px; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08)"><span role="cell" style="color: #B8BFCC">{{x.field}}</span><span role="cell">{{x.entered}}</span><span role="cell">{{x.extracted}}</span><span role="cell" style="color: {{x.fg}}; font-weight: 600">{{x.res}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{v.ocrFail}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="background: #3A2A05; border: 1px solid #F59E0B; color: #FEF3C7; border-radius: 10px; padding: 14px 16px; font-size: 14px">
<strong>OCR couldn't read this document.</strong><br>The image is too blurry to extract text. Compare the document with the registration manually below, or ask the applicant to upload a clearer copy.
<div style="margin-top: 10px"><button type="button" onClick="{{retryOcr}}" style="min-height: 40px; padding: 0 14px; background: transparent; color: #FEF3C7; border: 1px solid #F59E0B; border-radius: 8px; font-size: 13px">Retry OCR</button></div>
</div>
</sc-if>
<h3 style="margin: 18px 0 8px; font-size: 14px; color: #D1D5DB">Registration details</h3>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; font-size: 14px">
<div><dt style="font-size: 12px; color: #B8BFCC">Full name</dt><dd style="margin: 0">{{v.name}}</dd></div>
<div><dt style="font-size: 12px; color: #B8BFCC">Address</dt><dd style="margin: 0">{{v.blockLot}}</dd></div>
<div><dt style="font-size: 12px; color: #B8BFCC">Birthdate</dt><dd style="margin: 0">{{v.birth}}</dd></div>
<div><dt style="font-size: 12px; color: #B8BFCC">Email</dt><dd style="margin: 0; overflow-wrap: anywhere">{{v.email}}</dd></div>
<div><dt style="font-size: 12px; color: #B8BFCC">Mobile</dt><dd style="margin: 0">{{v.phone}}</dd></div>
<div><dt style="font-size: 12px; color: #B8BFCC">Username</dt><dd style="margin: 0">{{v.username}}</dd></div>
</dl>
<sc-if value="{{v.hasReason}}" hint-placeholder-val="{{ false }}"><p style="margin: 14px 0 0; font-size: 14px; color: #FECACA">Rejection reason: {{v.reason}}</p></sc-if>
</section>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; margin-top: 18px">
<button type="button" onClick="{{goARes}}" style="min-height: 48px; padding: 0 20px; background: transparent; color: #F3F4F6; border: 1px solid #9CA3AF; border-radius: 8px; font-weight: 500">← Back to list</button>
<sc-if value="{{v.isPending}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 12px">
<button type="button" onClick="{{v.reject}}" style="min-height: 48px; padding: 0 22px; background: #B91C1C; color: #FFFFFF; border: none; border-radius: 8px; font-weight: 600">Reject application</button>
<button type="button" onClick="{{v.approve}}" style="min-height: 48px; padding: 0 22px; background: #15803D; color: #FFFFFF; border: none; border-radius: 8px; font-weight: 600">Approve resident</button>
</div>
</sc-if>
</div>
</sc-if>

<!-- SCR-19 POST ANNOUNCEMENTS -->
<sc-if value="{{s.aann}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px">
<div><h1 style="margin: 0; font-size: 28px; color: #F5B800">Post announcements</h1><p style="margin: 2px 0 0; color: #C9CED8; font-size: 14px">Published announcements appear immediately on residents' View Announcements page.</p></div>
<sc-if value="{{anClosed}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{openAnnForm}}" style="min-height: 44px; padding: 0 18px; background: #F5B800; color: #1A1A1A; border: none; border-radius: 8px; font-weight: 600">+ Create announcement</button></sc-if>
</div>
<sc-if value="{{anOpen}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{publishAnn}}" novalidate="true" aria-labelledby="anf-h" style="background: rgba(255,255,255,0.08); border: 1px solid #F5B800; border-radius: 14px; padding: 20px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 16px">
<h2 id="anf-h" style="margin: 0; font-size: 18px">{{anFormTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div>
<label for="an_title" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Title <span aria-hidden="true" style="color: #FCD34D">*</span></label>
<input id="an_title" type="text" maxlength="100" value="{{f.an_title}}" onChange="{{on.an_title}}" aria-invalid="{{inv.an_title}}" aria-required="true" aria-describedby="an_title-help" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; border: 1px solid {{bc.an_title}}">
<p id="an_title-help" style="margin: 6px 0 0; font-size: 13px; color: #B8BFCC">5–100 characters.</p>
<sc-if value="{{err.an_title}}" hint-placeholder-val="{{ false }}"><p style="display: flex; gap: 6px; align-items: flex-start; color: #FCA5A5; font-size: 13px; margin: 6px 0 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>{{err.an_title}}</p></sc-if>
</div>
<div>
<label for="an_cat" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Category <span aria-hidden="true" style="color: #FCD34D">*</span></label>
<select id="an_cat" value="{{f.an_cat}}" onChange="{{on.an_cat}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; border: 1px solid #6B7280">
<option value="General">General</option><option value="Dues">Dues</option><option value="Events">Events</option><option value="Sanitation">Sanitation</option><option value="Security">Security</option><option value="Utilities">Utilities</option>
</select>
</div>
</div>
<div>
<label for="an_body" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Message <span aria-hidden="true" style="color: #FCD34D">*</span></label>
<textarea id="an_body" rows="4" maxlength="2000" value="{{f.an_body}}" onChange="{{on.an_body}}" aria-invalid="{{inv.an_body}}" aria-required="true" aria-describedby="an_body-help" style="width: 100%; box-sizing: border-box; min-height: 110px; padding: 10px 12px; border-radius: 8px; background: #0F141E; color: #F3F4F6; font-family: inherit; font-size: 15px; resize: vertical; border: 1px solid {{bc.an_body}}"></textarea>
<p id="an_body-help" style="margin: 6px 0 0; font-size: 13px; color: #B8BFCC">10–2000 characters.</p>
<sc-if value="{{err.an_body}}" hint-placeholder-val="{{ false }}"><p style="display: flex; gap: 6px; align-items: flex-start; color: #FCA5A5; font-size: 13px; margin: 6px 0 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>{{err.an_body}}</p></sc-if>
</div>
<div>
<label for="an_image" style="display: block; font-size: 14px; font-weight: 500; color: #E5E7EB; margin-bottom: 6px">Image (optional)</label>
<input id="an_image" type="file" accept=".jpg,.jpeg,.png" onChange="{{on.an_image}}" style="font-family: inherit; font-size: 14px; color: #E5E7EB">
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end">
<button type="button" onClick="{{closeAnnForm}}" style="min-height: 44px; padding: 0 20px; background: transparent; color: #F3F4F6; border: 1px solid #9CA3AF; border-radius: 8px; font-weight: 500">Cancel</button>
<button type="submit" style="min-height: 44px; padding: 0 22px; background: #F5B800; color: #1A1A1A; border: none; border-radius: 8px; font-weight: 600">{{anSubmitLabel}}</button>
</div>
</form>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{adminAnn}}" as="a" hint-placeholder-count="3">
<article style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 18px; display: flex; flex-wrap: wrap; gap: 18px">
<div aria-hidden="true" style="flex: 0 0 120px; height: 96px; border-radius: 10px; background: {{a.tile}}; display: flex; align-items: center; justify-content: center; color: #F3F4F6; font-size: 13px; font-weight: 600">{{a.cat}}</div>
<div style="flex: 1 1 300px; min-width: 0">
<h2 style="margin: 0; font-size: 18px; color: #F5B800">{{a.title}}</h2>
<p style="margin: 2px 0 8px; font-size: 13px; color: #B8BFCC">By {{a.by}} · {{a.dateText}}</p>
<p style="margin: 0; color: #E5E7EB; max-width: 72ch">{{a.body}}</p>
</div>
<div style="display: flex; gap: 8px; align-items: flex-start">
<button type="button" onClick="{{a.edit}}" aria-label="{{a.editAria}}" style="min-height: 36px; padding: 0 12px; background: transparent; color: #F3F4F6; border: 1px solid #9CA3AF; border-radius: 8px; font-size: 13px">Edit</button>
<button type="button" onClick="{{a.del}}" aria-label="{{a.delAria}}" style="min-height: 36px; padding: 0 12px; background: #B91C1C; color: #FFFFFF; border: none; border-radius: 8px; font-size: 13px; font-weight: 600">Delete</button>
</div>
